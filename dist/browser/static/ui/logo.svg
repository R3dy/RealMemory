      <path d="M100 122 L128 128 L156 122" opacity="0.7"/>
    </g>
    <!-- glowing synapse node ends -->
    <g fill="#00d4ff" stroke="none">
      <circle cx="106" cy="122" r="3.2"/>
      <circle cx="150" cy="122" r="3.2"/>
      <circle cx="102" cy="158" r="3.2"/>
      <circle cx="154" cy="158" r="3.2"/>
      <circle cx="128" cy="66" r="3.6"/>
