      <path d="M128 14 L144 40 L112 40 Z" transform="rotate(72 128 128)"/>
      <path d="M128 14 L144 40 L112 40 Z" transform="rotate(108 128 128)"/>
      <path d="M128 14 L144 40 L112 40 Z" transform="rotate(144 128 128)"/>
      <path d="M128 14 L144 40 L112 40 Z" transform="rotate(180 128 128)"/>
      <path d="M128 14 L144 40 L112 40 Z" transform="rotate(216 128 128)"/>
      <path d="M128 14 L144 40 L112 40 Z" transform="rotate(252 128 128)"/>
      <path d="M128 14 L144 40 L112 40 Z" transform="rotate(288 128 128)"/>
      <path d="M128 14 L144 40 L112 40 Z" transform="rotate(324 128 128)"/>
